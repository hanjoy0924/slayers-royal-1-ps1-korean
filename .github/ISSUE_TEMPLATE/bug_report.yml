name: 게임 오류 및 화면 표시 문제
description: 멈춤, 진행 불가, 글자 깨짐, 겹침, 색상 이상을 제보합니다.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: |
        제보는 공개됩니다. 개인 정보, 원본 게임 파일, BIN/CUE, BIOS는 첨부하지 마세요.
        가능하면 기존 제보에서 같은 문제가 있는지 먼저 확인해 주세요.
  - type: input
    id: patch_version
    attributes:
      label: 한글패치 버전
      placeholder: 사용 중인 배포 버전 또는 패치 파일 이름
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 에뮬레이터 이름과 버전 또는 실기 사용 여부를 적어 주세요.
      placeholder: "예: Windows / DuckStation / 에뮬레이터 버전"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 발생 장소 및 재현 순서
      description: 캐릭터, 장소, 메뉴, 선택한 항목 등 다시 확인할 수 있는 순서를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 문제 내용
      description: 실제로 나타난 현상과 정상적으로 기대한 동작을 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: save_state
    attributes:
      label: 세이브 스테이트 사용 여부
      options:
        - 사용하지 않음
        - 현재 패치 버전에서 만든 스테이트 사용
        - 이전 패치 버전에서 만든 스테이트 사용
        - 잘 모르겠음
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 및 추가 정보
      description: 문제가 보이는 화면을 첨부해 주세요. 개인정보가 보이지 않는지 확인해 주세요.
